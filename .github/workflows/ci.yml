name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API build and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore API and tests
        run: dotnet restore MyApp.Api.Tests/MyApp.Api.Tests.csproj
      - name: Build API
        run: dotnet build MyApp.Api/MyApp.Api.csproj --configuration Release --no-restore
      - name: Run SQLite API integration tests
        run: dotnet test MyApp.Api.Tests/MyApp.Api.Tests.csproj --configuration Release --no-restore

  frontend:
    name: React build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: myapp.client
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: myapp.client/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run frontend tests
        run: npm test
      - name: Build production frontend
        run: npm run build
      - name: Lint
        run: npm run lint
